<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Admin Dashboard - HARAMBEE CASH!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #1a1a2e;
            --secondary-dark: #16213e;
            --accent-gold: #ffcc00;
            --accent-gold-light: #ffd700;
            --success-green: #4CAF50;
            --warning-orange: #FF9800;
            --error-red: #f44336;
            --info-blue: #2196F3;
            --purple: #9C27B0;
            --teal: #009688;
            --text-light: #FFFFFF;
            --text-muted: #CCCCCC;
            --card-bg: rgba(0, 0, 0, 0.7);
            --card-bg-light: rgba(255, 255, 255, 0.05);
            --border-radius: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient-primary: linear-gradient(135deg, #43cea2, #185a9d);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--gradient-primary);
            color: var(--text-light);
            min-height: 100vh;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 204, 0, 0.1);
        }

        .header-left h1 {
            color: var(--accent-gold);
            font-size: 1.8rem;
            margin: 0;
        }

        .header-left p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .admin-info {
            background: rgba(255, 204, 0, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
            border-left: 5px solid var(--accent-gold);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            padding: 12px 24px;
            border-radius: 8px;
            color: var(--text-light);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255,215,0,0.1);
            transform: translateY(-2px);
        }

        .main-content {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .content-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 15px 25px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold);
        }

        .tab-content {
            padding: 25px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            overflow: hidden;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-table th {
            background: rgba(76, 175, 80, 0.15);
            color: var(--accent-gold);
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .form-section {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-section h3 {
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 6px;
            color: white;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--success-green);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border-left: 4px solid var(--success-green);
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.2);
            border-left: 4px solid var(--error-red);
        }

        .alert-info {
            background: rgba(33, 150, 243, 0.2);
            border-left: 4px solid var(--info-blue);
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            margin-top: 20px;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 10px;
        }

        .footer a:hover {
            color: var(--accent-gold);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status-pending {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
        }

        .status-suspended {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .admin-header { flex-direction: column; text-align: center; gap: 15px; }
            .tab-btn { padding: 10px 15px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="header-left">
            <h1><i class="fas fa-crown"></i> Admin Dashboard</h1>
            <p>Complete control panel for HARAMBEE CASH platform</p>
        </div>
        <div class="admin-info">
            <p><i class="fas fa-user-shield"></i> Logged in as: <strong>{{ session.get('admin_username', 'Admin') }}</strong></p>
        </div>
    </div>

    {% block content %}{% endblock %}

    <div class="footer">
        <a href="{{ url_for('game.index') }}"><i class="fas fa-home"></i> Home</a>
        <a href="{{ url_for('auth.admin_logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        <p style="margin-top: 15px; color: var(--text-muted);">&copy; 2025 Pigasimu. All rights reserved.</p>
    </div>

    <script>
        // CSRF token handling for admin forms
        document.addEventListener('DOMContentLoaded', function() {
            // Try to get CSRF token from various sources
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || 
                             document.querySelector('input[name="csrf_token"]')?.value || 
                             document.getElementById('csrf_token')?.value ||
                             "{{ csrf_token() }}";
            
            // Add CSRF token to all forms that don't have it
            document.querySelectorAll('form').forEach(function(form) {
                if (!form.querySelector('input[name="csrf_token"]')) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'csrf_token';
                    input.value = csrfToken;
                    form.prepend(input);
                }
            });
            
            // Store CSRF token globally for JavaScript access
            window.csrfToken = csrfToken;
        });
    </script>
</body>
</html>
