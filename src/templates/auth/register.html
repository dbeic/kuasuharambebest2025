{% extends "base.html" %}

{% block title %}Register - HARAMBEE CASH{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="color: var(--text-gold); margin-bottom: 24px; text-align: center;">Create Account</h2>
    
    {% if error %}
    <div class="alert alert-error" style="background: rgba(255,107,53,0.1); border-left: 4px solid var(--error); padding: 12px; margin-bottom: 20px;">
        {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Email</label>
            <input type="email" name="email" required 
                   style="width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; color: white;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Username (Tel Number)</label>
            <input type="text" name="username" required 
                   style="width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; color: white;">
        </div>
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Password</label>
            <input type="password" name="password" required 
                   style="width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; color: white;">
            <small style="color: var(--text-muted);">Minimum 6 characters</small>
        </div>
        
        <button type="submit" class="cta-button" style="width: 100%; justify-content: center;">
            Register
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--text-gold);">Login</a>
    </p>
</div>
{% endblock %}
